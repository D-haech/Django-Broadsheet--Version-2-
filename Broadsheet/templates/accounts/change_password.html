{% extends "base.html" %}

{% block content %}

<div class="card mt-4">

    <div class="card-header">
        Change Password
    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Change Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
