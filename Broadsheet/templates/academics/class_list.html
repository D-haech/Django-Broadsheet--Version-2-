{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h3>Classes</h3>

        <a href="{% url 'class_create' %}"
           class="btn btn-primary">
            Add Class
        </a>

    </div>

    <table class="table table-bordered">

        <thead>

            <tr>
                <th>Name</th>
                <th width="200">Actions</th>
            </tr>

        </thead>

        <tbody>

            {% for class_obj in classes %}

            <tr>

                <td>{{ class_obj.name }}</td>

                <td>

                    <a href="{% url 'class_update' class_obj.pk %}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'class_delete' class_obj.pk %}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="2">
                    No classes found.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
