{% extends "base.html" %}

{% block content %}

<div class="card">

    <div class="card-header">

        {% if object %}
            Edit Student
        {% else %}
            Create Student
        {% endif %}

    </div>

    <div class="card-body">

        <form method="post"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success">
                Save
            </button>

            <a href="{% url 'student_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
