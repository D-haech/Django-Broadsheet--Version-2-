{% extends "base.html" %}

{% block content %}

<h3>
    Delete Term?
</h3>

<p>

    {{ object }}

</p>

<form method="post">

    {% csrf_token %}

    <button type="submit"
            class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'term_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
