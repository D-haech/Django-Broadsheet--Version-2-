{% extends "base.html" %}

{% block content %}

<div class="card mt-4">

    <div class="card-header">

        Assign Classes

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save
            </button>

        </form>

    </div>

</div>

{% endblock %}
